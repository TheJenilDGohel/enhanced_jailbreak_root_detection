name: Bug Report 🐛
description: Report a problem with the plugin
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Info
      description: e.g. Samsung S21, iPhone 13
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version
      description: e.g. Android 13, iOS 16.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please paste any relevant logs here.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checkbox
      options:
        - label: I am using the latest version of the plugin.
          required: true
        - label: I have tested this on a real device (not an emulator).
          required: true
